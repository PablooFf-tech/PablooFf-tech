name: Update repo list

on:
  schedule:
    - cron: "0 9 * * *"   # every day 09:00 UTC
  workflow_dispatch:       # run manually anytime
  push:
    branches: [main, master]
    paths:
      - "README.md"
      - ".github/workflows/update-repos.yml"

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      - name: Build repo cards
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const username = 'PablooFf-tech';
            const start = '<!-- REPO-LIST:START -->';
            const end = '<!-- REPO-LIST:END -->';

            const repos = await github.paginate(github.rest.repos.listForUser, {
              username,
              type: 'owner',
              sort: 'updated',
              per_page: 100,
            });

            const profileNames = new Set([username, `${username.toLowerCase()}`]);
            const filtered = repos.filter(r =>
              !r.fork &&
              !r.archived &&
              !r.private &&
              !profileNames.has(r.name)
            );

            let cards = '';
            if (filtered.length === 0) {
              cards = '<p align="center"><em>No public project repos yet — your next upload will show up here.</em></p>\n';
            } else {
              cards += '<div align="center">\n\n';
              for (const r of filtered.slice(0, 12)) {
                const pin = `https://github-readme-stats.vercel.app/api/pin/?username=${username}&repo=${encodeURIComponent(r.name)}&theme=github_dark&hide_border=true&bg_color=0D1117&title_color=58A6FF&icon_color=58A6FF&description_lines_count=2`;
                cards += `<a href="${r.html_url}">\n  <img src="${pin}" alt="${r.name}" />\n</a>\n`;
              }
              cards += '\n</div>\n';
              if (filtered.length > 12) {
                cards += `\n<p align="center"><a href="https://github.com/${username}?tab=repositories">+ ${filtered.length - 12} more repositories →</a></p>\n`;
              }
            }

            cards += `\n<!-- last sync: ${new Date().toISOString()} · ${filtered.length} public repos -->\n`;

            let readme = fs.readFileSync('README.md', 'utf8');
            const i0 = readme.indexOf(start);
            const i1 = readme.indexOf(end);
            if (i0 === -1 || i1 === -1 || i1 < i0) {
              throw new Error('REPO-LIST markers not found in README.md');
            }
            readme = readme.slice(0, i0 + start.length) + '\n' + cards + readme.slice(i1);
            fs.writeFileSync('README.md', readme);

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: refresh public repository cards"
            git push
          fi
